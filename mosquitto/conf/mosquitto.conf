# mosquitto/conf/mosquitto.conf — QM-WX VIVO Bridge MQTT broker 配置
# 参考 docs/research/mosquitto-vivo-bridge.md §3.3
#
# 用途：
#   - VIVO 手环 / vivo WATCH BLE 桥接 → Mosquitto → qm-wx-server mqtt.js subscribe
#   - server 端 device.service.syncTerra (待 V0.3.1 实现) + 后续自研 Bridge 都共用此 broker
#
# 启动：docker compose up -d mosquitto（依赖 postgres + redis）
# 鉴权：password_file + acl_file 双重（每个 device 只 pub 自己的 topic）
# TLS：8883 端口配证书（生产配 Let's Encrypt / 自签）

# ===== 全局 =====
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
autosave_on_changes false

# ===== 监听器 1: MQTT（内网/开发用，1883）=====
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ===== 监听器 2: MQTT over TLS（生产外网用，8883）=====
listener 8883
protocol mqtt
cafile /mosquitto/config/ca.crt
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key
require_certificate true
tls_version tlsv1.2

# ===== 日志 =====
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ===== 性能调优 =====
max_connections 1000
max_queued_messages 10000
message_size_limit 65536
queue_qos0_messages false  # QoS 0 消息掉线即丢，避免队列爆炸

# ===== 桥接（可选：跨 broker 同步，预留）=====
# connection bridge-to-other
# address other-broker.example.com:1883
# topic # both 0
# bridge_insecure false