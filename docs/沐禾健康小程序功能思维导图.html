# 沐禾健康小程序

## Tab① 今日(index)
- 打卡快捷卡 → 运动页
- 步数/心率/睡眠 3 数据卡 → 健康中心
- 天气建议卡 / 紫外线预警(uv-alert)
- 饮食摘要卡 → 饮食日记
- 月度报告 / 完整日报入口
- 历史记录折叠(collapsible)
- 微信运动当日自动同步

## Tab② 健康助手(ai-coach)
- GLM v4 流式对话(打字机)
- 📷 识图上传(GLM-4.6V 多模态)
- 快速提问卡 2×2(ai-quick-cards)
- 建议卡片 / 生成训练计划
- 健康提示 alert
- 语音输入(待 WechatSI 授权)

## Tab③ 我的(mine)
- 用户卡 + 成长等级(avatar-badge / level-card)
- 跑训结合总览(getUnifiedOverview)
- 通知红点(realtime WebSocket)
- 邀请加成卡(invite-bonus-card)
- 宫格入口
  - 跑者数据(runner)
  - 我的跑鞋(shoes)
  - 设备中心(device)
  - 会员中心(membership)
  - 用户服务协议(agreement)
  - 更多功能(more)
- 个人资料(profile)

## 运动与社区
- 运动打卡(sport)
  - GPS 跑步:轨迹地图 / 实时配速 / 暂停继续
  - 📷 拍照打卡 → 健康解读
  - 完成详情卡 + 成就分享海报
  - 选跑鞋自动记里程
- 跑群
  - 创建 / 加入跑群
  - 群榜单(group-detail)/ 周报战报
  - 我的榜单(ranking)
- 运动动态(feed)
  - 发布:图片 / 视频 / 话题 / 可见性 / 关联跑鞋
  - 点赞 / 评论 / 关注
  - 粉丝新帖 realtime 推送
  - 用户主页(user)

## 健康数据
- 健康中心(health)
  - 步数 / 心率 / 睡眠 / 体成分 tab
  - 周趋势 + 实时健康分(步数40+心率30+睡眠30)
  - 查看月报
- 设备中心(device)
  - BLE:心率带 / 小米体脂秤
  - 文件导入:佳明 FIT / 华为 TCX / COROS FIT / 小米 ZIP
  - 微信运动同步
  - VIVO 手环(stub 预留)
- 饮食日记(diet):拍照识餐 + 宏量营养
- 报告
  - 完整日报(report-detail)+ 评分公式卡
  - 月度报告(report-monthly)三段式

## 训练体系
- 锻炼训练(training)
  - 跑步 / 力量计划 + 周场次表
  - 马拉松赛事列表
  - 计划完成自动通知
- 力量训练(strength 4 页)
  - 主页:容量概览 / 7日柱状 / 日历热图 / ⭐收藏动作
  - 训练中:计时 / RPE / 休息倒计时 / 下组重量建议
  - 详情:PB 卡 / 完成度评分环 / 海报分享
  - 历史:分页加载 + 按动作过滤
- 跑者数据(runner)
  - 周报 / 年度报告
  - 跑步目标(距离 / 容量)
  - 完赛证书海报

## AI 能力
- AI 对话教练(GLM v4 SSE)
- 识图:餐食识别 / 运动截图确认打卡
- 佳明 FIT 解读(MiniMax M3)+ H5 兜底
- AI 运动洞察(insight)
  - 天气×配速相关性
  - AQI×心率散点
  - 体感区间配速 + 最佳区间

## 商业化与服务
- 会员中心(membership):权益 / 积分兑换 / 邀请加成
- 本地服务(content-list / content-detail)
  - 赛事报名(余额支付)
  - 成绩自报 + 赛事排行榜

## 基础与全局
- 激活向导(onboarding 4 步)
- 隐私弹窗(privacy-popup)/ 功能开关(feature-gate)
- 用户服务协议(agreement)
- 品牌色 #2D9D78 / TabBar 3 项 / 29 页 / 17 组件
