# docker-compose.yml — 1 键起开发环境
#
# 用法：
#   # 仅起数据库
#   docker compose up -d
#
#   # 起数据库 + 后端容器（生产模式）
#   docker compose --profile prod up -d --build
#
#   # 停 + 删数据
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: qmwx-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qmwx # V0.2.138 修正：实际 postgres 容器 DB 名（pre-existing bug 写错 qmwx_dev）
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qmwx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== MQTT broker（VIVO Bridge / Terra Bridge 复用，V0.2.145 增量）=====
  # 配置：mosquitto/conf/{mosquitto.conf, acl, passwd}
  # ACL 范式见 mosquitto/conf/acl；密码生成 `docker run --rm eclipse-mosquitto:2.0 mosquitto_passwd`
  # 详见 docs/research/mosquitto-vivo-bridge.md §3.2/3.3/3.4
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: qmwx-mosquitto
    profiles: ["prod"]  # 默认不启动（开发不需要 MQTT），生产 docker compose --profile prod 启
    ports:
      - "1883:1883"   # MQTT（内网）
      # - "8883:8883"  # MQTT over TLS（生产配证书后启用）
    volumes:
      - ./mosquitto/conf:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      # mosquitto 自带 mosquitto_pub -h localhost -t $SYS/health 检查健康度
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t '$SYS/health' -m 'ping' -u $${MQTT_USER:-anon} -P $${MQTT_PASS:-} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===== 后端服务（可选：用 --profile prod 启动）=====
  server:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: qmwx-server
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # DATABASE_URL: 由 env_file: .env 注入（V0.2.141 修复：避免写死占位密码导致 P1000）
      REDIS_URL: redis://redis:6379
      # MQTT_URL: 由 env_file: .env 注入（V0.2.145 Mosquitto Bridge；待 device.syncTerra/mqtt.js subscribe 实施）
      # MQTT_URL: mqtt://${MQTT_USER:-qmwx-server}:${MQTT_PASS}@mosquitto:1883
      CORS_ORIGINS: "*"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
