  # ===== 后端服务（可选：用 --profile prod 启动）=====
  server:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: qmwx-server
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # DATABASE_URL: 由 env_file: .env 注入（V0.2.141 修复：避免写死占位密码导致 P1000）
      REDIS_URL: redis://redis:6379
      # MQTT_URL: 由 env_file: .env 注入（V0.2.145 Mosquitto Bridge；待 device.syncTerra/mqtt.js subscribe 实施 + V0.2.146 mosquitto deploy debug 完成后）
      # MQTT_URL: mqtt://${MQTT_USER:-qmwx-server}:${MQTT_PASS}@mosquitto:1883
      CORS_ORIGINS: "*"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
