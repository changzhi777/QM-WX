# docker-compose.yml — 1 键起开发环境
#
# 用法：
#   # 仅起数据库
#   docker compose up -d
#
#   # 起数据库 + 后端容器（生产模式）
#   docker compose --profile prod up -d --build
#
#   # 停 + 删数据
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: qmwx-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qmwx # V0.2.138 修正：实际 postgres 容器 DB 名（pre-existing bug 写错 qmwx_dev）
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qmwx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== MQTT broker（VIVO Bridge / Terra Bridge 复用）=====
