# docker-compose.yml — 1 键起开发环境
#
# 用法：
#   # 仅起数据库
#   docker compose up -d
#
#   # 起数据库 + 后端容器（生产模式）
#   docker compose --profile prod up -d --build
#
#   # 停 + 删数据
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: qmwx-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qmwx # V0.2.138 修正：实际 postgres 容器 DB 名（pre-existing bug 写错 qmwx_dev）
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qmwx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== MQTT broker（VIVO Bridge / Terra Bridge 复用）=====
  # ⚠️ V0.2.149 第四次 debug 失败：自定义 Dockerfile.mosquitto + user:root 解决了 SIGKILL
  #    但新问题：bind mount conf volume 后 container 立即死（0 字节 stderr, 0.25s ExitCode 1, 1883 不 listen）
  # 临时禁用：保留 Dockerfile + 配置 + 调研 + debug TODO
  # 启用方式（debug 完成后）：取消下方注释 + 跑 `docker compose --profile prod up -d --no-deps mosquitto`
  # Debug 路径（按 ROI 排序）：
  #   1. 部署到 host systemd（绕过 docker，apt-get install mosquitto + systemctl start mosquitto）
  #   2. 换 confluentinc/cp-kafka-mqtt-bridge（无 chown 问题，k8s 原生）
  #   3. 换 EMQX（国内 MQTT broker，docker 兼容性更好）
  #   4. docker network host + alpine 直跑（不用 bind mount，绕开 volume 问题）
  #   5. podman compose（不同 namespace 解决 read-only + cgroup v2）
  # mosquitto:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.mosquitto
  #   image: qmwx-mosquitto:latest
  #   container_name: qmwx-mosquitto
  #   profiles: ["prod"]
  #   ports:
  #     - "1883:1883"
  #   volumes:
  #     - ./mosquitto/conf:/mosquitto/config
  #     - mosquitto_data:/mosquitto/data
  #     - mosquitto_log:/mosquitto/log
  #   restart: unless-stopped

  # ===== 后端服务（可选：用 --profile prod 启动）=====
  server:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: qmwx-server
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # DATABASE_URL: 由 env_file: .env 注入（V0.2.141 修复：避免写死占位密码导致 P1000）
      REDIS_URL: redis://redis:6379
      # MQTT_URL: 由 env_file: .env 注入（V0.2.145 Mosquitto Bridge；待 device.syncTerra/mqtt.js subscribe 实施 + V0.2.146 mosquitto deploy debug 完成后）
      # MQTT_URL: mqtt://${MQTT_USER:-qmwx-server}:${MQTT_PASS}@mosquitto:1883
      CORS_ORIGINS: "*"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
