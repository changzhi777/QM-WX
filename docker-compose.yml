# docker-compose.yml — 1 键起开发环境
#
# 用法：
#   # 仅起数据库
#   docker compose up -d
#
#   # 起数据库 + 后端容器（生产模式）
#   docker compose --profile prod up -d --build
#
#   # 停 + 删数据
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: qmwx-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qmwx # V0.2.138 修正：实际 postgres 容器 DB 名（pre-existing bug 写错 qmwx_dev）
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qmwx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== MQTT broker（VIVO Bridge / Terra Bridge 复用，V0.2.145 增量）=====
  # ⚠️ V0.2.146 暂时禁用：eclipse-mosquitto:2.0 entrypoint chown /mosquitto/config 持续失败导致容器循环 restart（ExitCode 1）
  # 调试待办：① 用 eclipse-mosquitto:1.6 老镜像 ② 用 confluentinc 替代 ③ 改 entrypoint 自定义 image
  # 配置 + ACL + 调研文档保留：mosquitto/conf/ + docs/research/mosquitto-vivo-bridge.md
  # 启用方式（debug 完成后）：取消下方注释 + 跑 `docker compose --profile prod up -d --no-deps mosquitto`
  # mosquitto:
  #   image: eclipse-mosquitto:2.0
  #   container_name: qmwx-mosquitto
  #   profiles: ["prod"]
  #   ports:
  #     - "1883:1883"
  #   volumes:
  #     - ./mosquitto/conf:/mosquitto/config
  #     - mosquitto_data:/mosquitto/data
  #     - mosquitto_log:/mosquitto/log
  #   healthcheck:
  #     test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t '$SYS/health' -m 'ping' -u $${MQTT_USER:-anon} -P $${MQTT_PASS:-} || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   restart: unless-stopped

  # ===== 后端服务（可选：用 --profile prod 启动）=====
  server:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: qmwx-server
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # DATABASE_URL: 由 env_file: .env 注入（V0.2.141 修复：避免写死占位密码导致 P1000）
      REDIS_URL: redis://redis:6379
      # MQTT_URL: 由 env_file: .env 注入（V0.2.145 Mosquitto Bridge；待 device.syncTerra/mqtt.js subscribe 实施 + V0.2.146 mosquitto deploy debug 完成后）
      # MQTT_URL: mqtt://${MQTT_USER:-qmwx-server}:${MQTT_PASS}@mosquitto:1883
      CORS_ORIGINS: "*"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  # mosquitto_data:  # V0.2.146 暂禁
  # mosquitto_log:
